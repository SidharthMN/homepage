<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidsoid's Chrome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="bg-image" src="" alt="Background" />
    <video id="bg-video" autoplay loop muted playsinline style="display: none;"></video>
    <canvas id="charging-canvas"></canvas>
    <div class="overlay"></div>

    <div class="news-widget glass fade-in">
      <div class="news-header">
        <div class="news-brand">
          <svg class="gnews-logo" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#007aff"/>
            <path d="M7 6H9.5L14.5 14.5V6H17V18H14.5L9.5 9.5V18H7V6Z" fill="white"/>
          </svg>
          <span class="news-brand-text">NewsAPI Tech</span>
        </div>
        <div class="news-controls">
          <button id="news-prev-btn" class="news-control-btn" title="Previous News"><i class="fas fa-chevron-left"></i></button>
          <button id="news-next-btn" class="news-control-btn" title="Next News"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="news-content">
        <a href="#" target="_blank" class="news-title" id="news-title-link">Loading real-time NewsAPI...</a>
        <div class="news-meta">
          <span class="news-source" id="news-source">NewsAPI</span>
          <span class="news-meta-divider">•</span>
          <span class="news-time" id="news-time">Just now</span>
        </div>
      </div>
    </div>

    <div class="weather-widget glass fade-in">
      <div id="get-location" class="location-btn" title="Detect Location">
        <i class="fas fa-location-crosshairs"></i>
      </div>
      <i class="fas fa-cloud-sun fa-2x"></i>
      <div class="weather-info">
        <div class="temp">24°C</div>
        <div class="location">London, UK</div>
      </div>
    </div>

    <div id="login-overlay" class="login-overlay glass">
      <div class="login-box modal-content glass">
        <h2>Welcome Back</h2>
        <p>Please click login to access your dashboard</p>
        <button id="login-btn" class="btn primary">Login</button>
      </div>
    </div>

    <div id="main-content" class="container content-blur">
      <div class="clock-container fade-in">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Monday, January 1</div>
      </div>

      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <form id="search-form" action="https://www.google.com/search" method="get">
          <input
            type="text"
            name="q"
            class="search-input"
            placeholder="Search Google..."
            autocomplete="off"
            id="search-input"
          />
        </form>
        <div class="engine-toggle-container">
          <div id="engine-toggle" class="engine-toggle" title="Switch Search Engine">
            <i class="fab fa-google"></i>
          </div>
          <div id="engine-dropdown" class="engine-dropdown"></div>
        </div>
        <div id="search-history" class="search-history-dropdown"></div>
      </div>

      <div class="shortcuts" id="shortcuts-container">
        <!-- Shortcuts will be rendered here -->
        <button class="shortcut add-shortcut-btn" id="add-shortcut-btn">
          <div class="shortcut-icon"><i class="fas fa-plus"></i></div>
          <span class="shortcut-name">Add</span>
        </button>
      </div>
    </div>
    
    <!-- Shortcut Modal -->
    <div id="shortcut-modal" class="modal">
      <div class="modal-content glass">
        <h3>Add Shortcut</h3>
        <div class="input-group">
          <label for="shortcut-name-input">Name</label>
          <input type="text" id="shortcut-name-input" placeholder="e.g., Google" />
        </div>
        <div class="input-group">
          <label for="shortcut-url-input">URL</label>
          <input type="text" id="shortcut-url-input" placeholder="e.g., https://google.com" />
        </div>
        <div class="modal-actions">
          <button id="cancel-shortcut" class="btn secondary">Cancel</button>
          <button id="save-shortcut" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Theme Switcher -->
    <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Dark/Light Mode">
      <i class="fas fa-moon"></i>
    </button>

    <!-- Wallpaper Controls -->
    <button id="edit-wallpaper-btn" class="edit-wallpaper-btn" title="Change Wallpaper">
      <i class="fas fa-image"></i>
    </button>
    <input type="file" id="wallpaper-upload" accept="image/*, video/*" style="display: none;" />

    <script src="script.js"></script>
  </body>
</html>
